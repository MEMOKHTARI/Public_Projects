---
- name: Install NFS server package
  ansible.builtin.dnf:
    name: nfs-server
    state: present

- name: Create exports directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0775"
  loop: "{{ nfs_exports }}"


- name: configure /etc/exports with template
  ansible.builtin.template:
    src: ../roles/nfs_servers/templates/exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload NFS exports
    - Restart NFS service


- name: Eanbel and restart NFS service 
  ansible.builtin.service:
    name: nfs-server
    state: restarted
    enabled: true
